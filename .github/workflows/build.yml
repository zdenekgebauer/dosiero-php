name: build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, iconv, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Coding standards (ECS)
        run: vendor/bin/ecs check --no-progress-bar

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyze -c build/phpstan.neon --no-progress --error-format=raw

      - name: Tests
        run: vendor/bin/codecept run Unit,Integration

      # the Api suite drives the connector over real http, which is the only place the CORS and
      # preflight headers are actually produced - php's built-in server is enough for that
      - name: Start endpoint
        run: |
          php -S 127.0.0.1:8080 -t tests/Support/Endpoint > /tmp/endpoint.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null "http://127.0.0.1:8080/?action=storages" -H 'X-Dosiero-Protocol: 1'; then
              exit 0
            fi
            sleep 0.5
          done
          echo "endpoint did not come up"; cat /tmp/endpoint.log; exit 1

      - name: Api tests
        run: vendor/bin/codecept run Api --env ci
