name: build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, iconv, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Coding standards (ECS)
        run: vendor/bin/ecs check --no-progress-bar

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyze -c build/phpstan.neon --no-progress --error-format=raw

      # suite names become Unit,Integration when the Codeception 5 upgrade
      # renames the directories
      - name: Tests
        run: vendor/bin/codecept run unit,integration
